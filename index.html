<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khadija Mulla | Java Backend Developer</title>

    <meta name="description"
          content="Khadija Mulla — Java Backend Developer, DSA Problem Solver and Computer Science Engineering student.">

    <!-- =========================
         GOOGLE FONTS
    ========================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
          rel="stylesheet">

    <!-- =========================
         FONT AWESOME
    ========================== -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --bg: #07111f;
            --bg-soft: #0a1626;
            --card: #0d1b2a;
            --card-hover: #102237;

            --blue: #38bdf8;
            --blue-dark: #0ea5e9;

            --white: #f8fafc;
            --text: #e2e8f0;
            --muted: #94a3b8;

            --border: rgba(148, 163, 184, 0.14);

            --green: #22c55e;

            --max-width: 1180px;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        ::selection {
            background: var(--blue);
            color: #03111c;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.055);
            filter: blur(100px);
            top: -200px;
            right: -150px;
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.04);
            filter: blur(100px);
            bottom: -200px;
            left: -150px;
            pointer-events: none;
            z-index: -1;
        }


        /* =========================================================
           COMMON
        ========================================================= */

        .container {
            width: min(var(--max-width), 90%);
            margin: auto;
        }

        section {
            padding: 110px 0;
        }

        .section-label {
            color: var(--blue);
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: clamp(30px, 4vw, 42px);
            color: var(--white);
            letter-spacing: -1.5px;
        }

        .section-description {
            color: var(--muted);
            max-width: 650px;
            margin-top: 12px;
        }

        .section-heading {
            margin-bottom: 55px;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 76px;
            z-index: 1000;

            background: rgba(7, 17, 31, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        }

        nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: "JetBrains Mono", monospace;
            font-size: 19px;
            font-weight: 600;
            color: var(--white);
        }

        .logo span {
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 13px;
            transition: 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--blue);
        }

        .nav-contact {
            padding: 8px 15px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 7px;
            color: var(--blue) !important;
        }

        .nav-contact:hover {
            background: rgba(56, 189, 248, 0.08);
        }

        .menu-toggle {
            display: none;
            border: none;
            background: transparent;
            color: var(--white);
            font-size: 22px;
            cursor: pointer;
        }


        /* =========================================================
           HERO
        ========================================================= */

        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 130px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 70px;
            align-items: center;
        }

        .availability {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 7px 12px;
            border-radius: 20px;

            background: rgba(34, 197, 94, 0.07);
            border: 1px solid rgba(34, 197, 94, 0.18);

            color: #86efac;
            font-size: 12px;

            margin-bottom: 24px;
        }

        .availability-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
        }

        .hero-intro {
            font-family: "JetBrains Mono", monospace;
            color: var(--blue);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .hero-title {
            font-size: clamp(48px, 7vw, 78px);
            line-height: 1;
            letter-spacing: -4px;
            color: var(--white);
            margin-bottom: 20px;
        }

        .hero-title span {
            color: var(--blue);
        }

        .hero-role {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .hero-description {
            color: var(--muted);
            max-width: 620px;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 11px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 11px 17px;
            border-radius: 7px;

            font-size: 13px;
            font-weight: 600;

            border: 1px solid var(--border);
            transition: 0.3s ease;
        }

        .btn-primary {
            color: #03111c;
            background: var(--blue);
            border-color: var(--blue);
        }

        .btn-primary:hover {
            background: var(--blue-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
        }

        .btn-outline {
            color: var(--text);
            background: rgba(255,255,255,0.015);
        }

        .btn-outline:hover {
            color: var(--blue);
            border-color: rgba(56, 189, 248, 0.45);
            transform: translateY(-2px);
        }

        .hero-socials {
            display: flex;
            gap: 18px;
        }

        .hero-socials a {
            color: var(--muted);
            font-size: 17px;
            transition: 0.3s;
        }

        .hero-socials a:hover {
            color: var(--blue);
            transform: translateY(-2px);
        }


        /* =========================================================
           CODE WINDOW
        ========================================================= */

        .code-window {
            border: 1px solid var(--border);
            background: #08131f;
            border-radius: 14px;
            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.28),
                0 0 0 1px rgba(56,189,248,0.015);
        }

        .window-top {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;

            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.015);
        }

        .window-dots {
            display: flex;
            gap: 7px;
        }

        .window-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #334155;
        }

        .window-file {
            font-family: "JetBrains Mono", monospace;
            color: #64748b;
            font-size: 11px;
        }

        .code-content {
            padding: 28px 25px 30px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            overflow-x: auto;
        }

        .code-line {
            display: flex;
            gap: 16px;
            min-height: 28px;
        }

        .line-number {
            width: 20px;
            text-align: right;
            color: #334155;
            user-select: none;
        }

        .code-text {
            color: #cbd5e1;
            white-space: nowrap;
        }

        .code-keyword {
            color: #c084fc;
        }

        .code-class {
            color: #38bdf8;
        }

        .code-string {
            color: #86efac;
        }

        .code-property {
            color: #fbbf24;
        }

        .code-comment {
            color: #475569;
        }

        .terminal-status {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);

            display: flex;
            justify-content: space-between;
            gap: 10px;

            color: #64748b;
            font-size: 11px;
        }

        .status-online {
            color: #86efac;
        }


        /* =========================================================
           ABOUT
        ========================================================= */

        #about {
            background: rgba(10, 22, 38, 0.45);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 70px;
            align-items: start;
        }

        .about-text p {
            color: var(--muted);
            margin-bottom: 19px;
            font-size: 15px;
        }

        .about-highlight {
            margin-top: 28px;
            padding: 19px 20px;

            border-left: 3px solid var(--blue);
            background: rgba(56, 189, 248, 0.035);

            color: #cbd5e1;
            font-size: 14px;
        }

        .about-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .mini-card {
            padding: 23px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 11px;
            transition: 0.3s;
        }

        .mini-card:hover {
            border-color: rgba(56,189,248,0.25);
            transform: translateY(-4px);
        }

        .mini-card i {
            color: var(--blue);
            font-size: 18px;
            margin-bottom: 15px;
        }

        .mini-card h3 {
            color: var(--white);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .mini-card p {
            color: var(--muted);
            font-size: 12px;
        }


        /* =========================================================
           SKILLS
        ========================================================= */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .skill-card {
            padding: 25px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            transition: 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56,189,248,0.25);
        }

        .skill-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 17px;
        }

        .skill-heading i {
            color: var(--blue);
        }

        .skill-heading h3 {
            font-size: 15px;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            padding: 7px 10px;
            background: #101f30;
            border: 1px solid rgba(148,163,184,0.1);
            color: #cbd5e1;

            border-radius: 6px;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
        }


        /* =========================================================
           LEETCODE
        ========================================================= */

        #leetcode {
            background: var(--bg-soft);
        }

        .leetcode-layout {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 70px;
            align-items: center;
        }

        .leetcode-number {
            font-size: clamp(65px, 9vw, 105px);
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -6px;
            color: var(--blue);
        }

        .leetcode-label {
            color: var(--muted);
            margin-top: 13px;
            font-size: 14px;
        }

        .leetcode-profile-card {
            padding: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 13px;
            margin-top: 30px;
        }

        .leetcode-profile-card div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .leetcode-profile-card div:last-child {
            border-bottom: none;
        }

        .leetcode-profile-card span:first-child {
            color: var(--muted);
        }

        .leetcode-profile-card span:last-child {
            color: var(--white);
            font-weight: 600;
        }

        .leetcode-copy h3 {
            font-size: 28px;
            color: var(--white);
            margin-bottom: 13px;
        }

        .leetcode-copy p {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 22px;
        }

        .topic-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .topic {
            padding: 7px 10px;
            border-radius: 6px;
            background: #0e1b2b;
            border: 1px solid var(--border);
            color: #cbd5e1;
            font-size: 11px;
        }

        .badge-row {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .badge {
            padding: 13px 16px;
            border-radius: 9px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .badge strong {
            display: block;
            color: var(--blue);
            font-size: 17px;
        }

        .badge span {
            color: var(--muted);
            font-size: 10px;
        }


        /* =========================================================
           PROJECTS
        ========================================================= */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .project-card {
            position: relative;
            display: flex;
            flex-direction: column;

            min-height: 300px;
            padding: 28px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 13px;

            transition: 0.35s ease;
            overflow: hidden;
        }

        .project-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--blue);
            transition: 0.4s ease;
        }

        .project-card:hover {
            transform: translateY(-7px);
            background: var(--card-hover);
            border-color: rgba(56,189,248,0.23);
        }

        .project-card:hover::before {
            width: 100%;
        }

        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .folder-icon {
            color: var(--blue);
            font-size: 24px;
        }

        .project-number {
            color: #475569;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
        }

        .project-card h3 {
            font-size: 21px;
            color: var(--white);
            margin-bottom: 10px;
        }

        .project-card p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 22px;
            flex-grow: 1;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .project-tech span {
            color: #94a3b8;
            font-family: "JetBrains Mono", monospace;
            font-size: 10px;
        }


        /* =========================================================
           EXPERIENCE
        ========================================================= */

        #experience {
            background: rgba(10, 22, 38, 0.45);
        }

        .timeline {
            max-width: 850px;
        }

        .timeline-item {
            position: relative;
            padding: 0 0 45px 35px;
            border-left: 1px solid #26384b;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -5px;
